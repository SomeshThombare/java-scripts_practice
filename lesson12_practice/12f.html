<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12f</title>
</head>
<body>
    <button class="js-add-to-cart">Add to cart</button>
    <p id="para"></p>
    <script>
        let timeoutId;
        let AddTocartBtn = document.querySelector('.js-add-to-cart');
        let displyresult = document.querySelector('#para');

        AddTocartBtn.addEventListener('click',()=>{
            displyresult.innerHTML = 'Added';
            clearTimeout(timeoutId);
        timeoutId = setTimeout(()=>{
            displyresult.innerHTML = '';
    },2000);
});

    </script>
</body>
</html>
