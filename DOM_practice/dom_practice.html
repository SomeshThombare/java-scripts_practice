<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        }

    <button class="js-button" onclick="classContainer();">Test</button>

    <button id="male" class="js-gender not-active" onclick="toggleGender('#male');">Male</button>

    <button id="female" class="js-gender not-active" onclick="toggleGender('#female');">Femal</button>

    <button id="other" class="js-gender not-active" onclick="toggleGender('#other');">Other</button>
